name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python that pyproject.toml supports.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  package:
    # Builds the files that would be uploaded to PyPI and runs the tests from
    # the unpacked sdist, the way downstream packagers (e.g. conda-forge) do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test from the sdist
        run: |
          mkdir sdist && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist
          python -m pip install ".[dev]"
          python -m pytest -q
