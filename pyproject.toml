[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sonore"
dynamic = ["version"]
description = "Signals and stimuli for auditory research: generators, filterbanks, STFTs, binaural cues, HRIR spatialization, synthetic reverb."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adrian Cho", email = "choyun1@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["psychoacoustics", "auditory", "hearing", "binaural", "HRTF", "stimuli", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",      # ShortTimeFFT
    "matplotlib>=3.8",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/choyun1/sonore"
Gallery = "https://choyun1.github.io/sonore/gallery/"
Source = "https://github.com/choyun1/sonore"
Issues = "https://github.com/choyun1/sonore/issues"
Changelog = "https://github.com/choyun1/sonore/blob/main/CHANGELOG.md"

[project.optional-dependencies]
play = ["sounddevice>=0.4"]
sofa = ["h5py>=3.8"]
notebook = ["ipykernel", "ipython", "ipywidgets", "tqdm"]
docs = ["sphinx>=7", "furo"]
dev = ["pytest>=8", "ruff>=0.5", "h5py>=3.8"]

[tool.hatch.version]
path = "src/sonore/__init__.py"

[tool.hatch.build.targets.sdist]
# Code, tests and the tools the tests load. The docs (images, gallery, audio
# samples) stay in the repository; the README and gallery tests skip without them.
only-include = ["src", "tests", "tools", "CHANGELOG.md", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
packages = ["src/sonore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # so tests in subfolders can import tests/helpers.py
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"docs/gallery/build.py" = ["E501"]  # prose in string literals
"tools/draw_layout.py" = ["E501"]  # SVG in string literals

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]
