[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sonore"
dynamic = ["version"]
description = "Signals and stimuli for auditory research: generators, filterbanks, STFTs, binaural cues, HRIR spatialization, synthetic reverb."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adrian Cho", email = "choyun1@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["psychoacoustics", "auditory", "hearing", "binaural", "HRTF", "stimuli", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",      # ShortTimeFFT
    "matplotlib>=3.8",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/choyun1/sonore"
Issues = "https://github.com/choyun1/sonore/issues"

[project.optional-dependencies]
play = ["sounddevice>=0.4"]
sofa = ["h5py>=3.8"]
notebook = ["ipykernel", "ipython", "ipywidgets", "tqdm"]
dev = ["pytest>=8", "ruff>=0.5", "h5py>=3.8"]

[tool.hatch.version]
path = "src/sonore/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs/gallery/audio", "docs/gallery/img", "docs/gallery/*.html", "docs/images"]

[tool.hatch.build.targets.wheel]
packages = ["src/sonore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"docs/gallery/build.py" = ["E501"]  # prose in string literals

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]
